    <style>
        :root {
            --bg-body: #0d1117;
            --bg-btn: #21262d;
            --bg-caption: #161b22;
            --border-color: #30363d;
            --accent-shadow: #cb4c3e;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --btn-icon: #8b949e;
            --btn-focus: #58a6ff;
            --radius-btn: 14px;
            --radius-sq: 18px;
            --grid-gap: 14px;
            --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(60px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        main {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        /* Профиль */
        .avatar {
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
            margin-bottom: 16px;
            background-color: #161b22;
            display: inline-block;
        }

        /* Имя гарантированно в одну строку без переносов */
        h1 {
            font-size: clamp(1.05rem, 4.8vw, 1.45rem);
            color: var(--text-main);
            margin: 0 0 6px 0;
            letter-spacing: -0.3px;
            line-height: 1.25;
            font-weight: 700;
            white-space: nowrap;
        }

        /* Плотный слэш в цвет кирпичной тени */
        .slash {
            color: var(--accent-shadow);
            font-weight: 900;
            margin: 0 3px;
            display: inline-block;
        }

        /* Лаконичная плотная подпись FILMMAKER */
        .subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin: 0 0 24px 0;
            line-height: 1.4;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Единый контейнер для иконок */
        .links-stack {
            display: flex;
            flex-direction: column;
            gap: var(--grid-gap);
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        /* Кнопки */
        .btn-base {
            background-color: var(--bg-btn);
            color: var(--btn-icon);
            border: 2px solid var(--border-color);
            box-shadow: 5px 5px 0px var(--accent-shadow);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.875rem;
            letter-spacing: 0.5px;
            user-select: none;
            touch-action: manipulation;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.1s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.15s ease;
        }

        .btn-base:focus-visible {
            outline: 2px solid var(--btn-focus);
            outline-offset: 4px;
        }

        @media (hover: hover) {
            .btn-base:hover {
                transform: translate(2px, 2px);
                box-shadow: 3px 3px 0px var(--accent-shadow);
                color: #ffffff;
            }
        }

        .btn-base:active {
            transform: translate(5px, 5px);
            box-shadow: 0px 0px 0px var(--accent-shadow);
            color: #ffffff;
        }

        /* Сетка квадратных иконок */
        .square-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--grid-gap);
        }

        .sq-btn {
            aspect-ratio: 1 / 1;
            border-radius: var(--radius-sq);
        }

        .sq-btn svg {
            pointer-events: none;
        }

        .icon-stroke {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-linkedin {
            width: 35px;
            height: 35px;
            fill: currentColor;
        }

        .icon-imdb {
            width: 48px;
            height: 18px;
            fill: currentColor;
        }

        /* Сетка видео: 1 колонка на телефоне, 3 на компьютере */
        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--grid-gap);
            width: 100%;
            margin-top: calc(var(--grid-gap) + 5px);
        }

        .video-card {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: var(--radius-btn);
            overflow: hidden;
            border: 2px solid var(--border-color);
            background-color: var(--bg-btn);
            isolation: isolate;
        }

        .video-card iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* Тёмная непрозрачная полоска с подписью (22% высоты внизу) */
        .video-caption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 22%;
            min-height: 38px;
            background-color: var(--bg-caption);
            border-top: 1px solid var(--border-color);
            color: var(--accent-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 8px;
            z-index: 2;
            overflow: hidden;
            transform: translateY(0);
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
            cursor: pointer;
            user-select: none;
        }

        .video-caption:empty {
            display: none;
        }

        .video-caption-text {
            display: block;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            font-size: 0.96rem;
            font-weight: 600;
            line-height: 1.2;
            color: var(--accent-shadow);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        /* На компьютере: плавно опускается вниз при наведении мыши */
        @media (hover: hover) {
            .video-card:hover .video-caption,
            .video-card:focus-within .video-caption {
                transform: translateY(100%);
            }
        }

        /* Когда видео запущено или шторка открыта тапом на смартфоне */
        .video-card.is-active .video-caption {
            transform: translateY(100%);
            pointer-events: none;
        }

        /* 3 видео по ширине колонки с кнопками (400px), среднее совпадает с ней */
        @media (min-width: 1260px) {
            main {
                max-width: calc(400px * 3 + var(--grid-gap) * 2);
            }

            .video-grid {
                grid-template-columns: repeat(3, 400px);
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .btn-base,
            .video-caption {
                transition: none;
            }
            .btn-base:hover, .btn-base:active {
                transform: none;
            }
        }
    </style>
